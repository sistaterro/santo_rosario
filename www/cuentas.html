<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rezar el Santo Rosario</title>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="cuentas-screen">

<header id="nav">
  <div class="shell">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">✞ El Santo Rosario</a>
      <nav class="nav-links">
        <a href="index.html#misterios">Misterios</a>
        <a href="index.html#oraciones">Oraciones</a>
      </nav>
      <a href="index.html" class="nav-rezar">Inicio</a>
    </div>
  </div>
</header>

<section id="rezar">
  <div class="rosary-burst" id="rosary-burst" aria-hidden="true"></div>
  <div class="shell">

    <div class="cuentas-panel cuentas-panel--principal">
        <div class="guia-oracion" id="guia-oracion" hidden>
          <span class="guia-oracion__rubrica" id="guia-rubrica">Apertura</span>
          <div class="guia-oracion__titulo" id="guia-titulo">Señal de la Santa Cruz</div>
          <div class="guia-oracion__texto" id="guia-texto"></div>
        </div>

        <div class="contador-display">
          <span class="contador-display__oracion" id="titulo-contador">Señal de la Cruz</span>
        </div>

        <div class="progreso-misterio" style="max-width:360px;width:100%;">
          <div class="progreso-misterio__label">
            <span id="prog-label">Preparación</span>
            <span id="prog-pct">0%</span>
          </div>
          <div class="progreso-misterio__bar">
            <div class="progreso-misterio__fill" id="prog-fill" style="width:0%"></div>
          </div>
        </div>

        <svg id="rosario-svg" viewBox="-12 -12 224 280" xmlns="http://www.w3.org/2000/svg"
             aria-label="Cuentas del rosario" role="img">
          <path d="M 112.1 16.8 A 101 116 0 1 1 87.9 16.8" fill="none" stroke="rgba(255,211,91,.38)" stroke-width="1.2" stroke-dasharray="3 5"/>
          <text id="centro-ayuda" class="centro-ayuda" x="100" y="92" text-anchor="middle">COMENZÁ ACÁ</text>
          <g id="btn-centro-avanzar" class="centro-avanzar" role="button" aria-label="Siguiente oración" tabindex="0">
            <circle class="centro-pulso" cx="100" cy="132" r="30" fill="none" stroke="rgba(255,224,116,.68)" stroke-width="1.2"/>
            <circle cx="100" cy="132" r="30" fill="rgba(6,18,38,.95)" stroke="rgba(255,211,91,.74)" stroke-width="1.45"/>
            <text x="100" y="124" text-anchor="middle" font-size="24" fill="rgba(255,211,91,.96)">♱</text>
          </g>
          <text x="100" y="151" text-anchor="middle" font-family="Cinzel" font-size="8.2" fill="rgba(255,248,225,.94)" letter-spacing=".25">MARIA</text>
          <text id="centro-misterio" x="100" y="181" text-anchor="middle" font-family="Cinzel" font-size="7" fill="rgba(255,248,225,.92)" letter-spacing=".15">PREPARACION</text>

          <g id="cuentas-group"></g>
        </svg>
    </div>

    <div class="cuentas-actions" aria-label="Opciones del rosario">
      <button class="btn-reiniciar cuentas-reset" id="btn-reiniciar-rosario" type="button">
        Empezar de nuevo
      </button>

      <label class="cuentas-toggle">
        <input type="checkbox" id="toggle-guia-oracion">
        <span>Mostrar guía de oración</span>
      </label>
    </div>
  </div>
</section>

<script src="capacitor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
