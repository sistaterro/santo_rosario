<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rezar el Santo Rosario</title>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="cuentas-screen">

<header id="nav">
  <div class="shell">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">✞ El Santo Rosario</a>
      <nav class="nav-links">
        <a href="index.html#misterios">Misterios</a>
        <a href="index.html#oraciones">Oraciones</a>
      </nav>
      <a href="index.html" class="nav-rezar">Inicio</a>
    </div>
  </div>
</header>

<section id="rezar">
  <div class="shell">

    <div class="cuentas-panel cuentas-panel--principal">
        <div class="contador-display">
          <span class="contador-display__num" id="num-cuenta">0</span>
          <span class="contador-display__label">Ave Marías rezadas</span>
          <span class="contador-display__oracion" id="titulo-contador">Señal de la Cruz</span>
        </div>

        <div class="progreso-misterio" style="max-width:360px;width:100%;">
          <div class="progreso-misterio__label">
            <span id="prog-label">Preparación</span>
            <span id="prog-pct">0%</span>
          </div>
          <div class="progreso-misterio__bar">
            <div class="progreso-misterio__fill" id="prog-fill" style="width:0%"></div>
          </div>
        </div>

        <svg id="rosario-svg" viewBox="-12 -12 224 280" xmlns="http://www.w3.org/2000/svg"
             aria-label="Cuentas del rosario" role="img">
          <ellipse cx="100" cy="132" rx="101" ry="116" fill="none" stroke="rgba(255,211,91,.38)" stroke-width="1.2" stroke-dasharray="3 5"/>
          <g id="btn-centro-avanzar" class="centro-avanzar" role="button" aria-label="Siguiente oración" tabindex="0">
            <circle cx="100" cy="132" r="24" fill="rgba(6,18,38,.95)" stroke="rgba(255,211,91,.72)" stroke-width="1.35"/>
            <text x="100" y="126" text-anchor="middle" font-size="21" fill="rgba(255,211,91,.96)">♱</text>
          </g>
          <text x="100" y="146" text-anchor="middle" font-family="Cinzel" font-size="7.8" fill="rgba(255,248,225,.94)" letter-spacing=".25">MARIA</text>
          <text id="centro-misterio" x="100" y="169" text-anchor="middle" font-family="Cinzel" font-size="7" fill="rgba(255,248,225,.92)" letter-spacing=".15">PREPARACION</text>

          <g id="cuentas-group"></g>
        </svg>

        <div class="rosario-completo" id="rosario-completo">
          <span class="rosario-completo__cruz">✞</span>
          <div class="rosario-completo__titulo">Rosario completado</div>
        </div>
    </div>
  </div>
</section>

<script src="capacitor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
